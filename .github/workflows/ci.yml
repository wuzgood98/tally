name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing later pushes or fetches, so no step needs the token on disk.
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Route types (PageProps and friends) live in .next/types and
      # next-env.d.ts, which are gitignored; the type-aware lint needs them too.
      - run: pnpm exec next typegen
      - run: pnpm check
      - run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing later pushes or fetches, so no step needs the token on disk.
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each test file gets its own in-memory Postgres (PGlite): no database service.
      - run: pnpm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing later pushes or fetches, so no step needs the token on disk.
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Placeholders so the build never depends on real secrets.
          BETTER_AUTH_SECRET: ci-build-only-not-a-real-secret-0123456789
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: 1
